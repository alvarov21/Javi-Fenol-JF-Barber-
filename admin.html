<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JF Barber | Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        vercel: {
                            bg: '#000000',
                            card: '#0a0a0a',
                            border: '#333333',
                            hover: '#1a1a1a',
                            text: '#ededed',
                            muted: '#a1a1aa',
                            blue: '#0070f3'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ededed;
        }
        .geist-border {
            border: 1px solid #333;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Top Navigation (Vercel Style) -->
    <nav class="border-b border-[#333] bg-black sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-6">
                    <!-- Logo / Workspace -->
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center font-bold text-sm">
                            JF
                        </div>
                        <span class="font-medium text-sm tracking-wide">JF Barber Studio</span>
                        <span class="bg-[#333] text-[#ededed] text-[10px] px-2 py-0.5 rounded-full font-medium ml-2">PRO</span>
                    </div>
                    
                    <!-- Links -->
                    <div class="hidden md:flex items-center gap-6 ml-8">
                        <a href="#" class="text-sm font-medium text-white border-b-2 border-white py-5">Bandeja de Citas</a>
                        <a href="#" class="text-sm font-medium text-[#a1a1aa] hover:text-white transition-colors py-5">Agenda General</a>
                        <a href="#" class="text-sm font-medium text-[#a1a1aa] hover:text-white transition-colors py-5">Clientes</a>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <button class="text-[#a1a1aa] hover:text-white transition-colors"><i class="fa-regular fa-bell"></i></button>
                    <div class="w-8 h-8 rounded-full bg-[#333] border border-[#444] overflow-hidden">
                        <img src="./javi-profile.webp" alt="Admin" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-10">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-semibold mb-2">Bandeja de Entrada</h1>
                <p class="text-[#a1a1aa] text-sm">Gestiona las nuevas solicitudes de reserva entrantes.</p>
            </div>
            <div class="flex gap-3">
                <button class="bg-[#111] hover:bg-[#1a1a1a] text-white border border-[#333] px-4 py-2 rounded-md text-sm font-medium transition-colors">
                    Configuración
                </button>
                <button class="bg-white hover:bg-gray-200 text-black px-4 py-2 rounded-md text-sm font-medium transition-colors">
                    Nueva Cita Manual
                </button>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
            <div class="bg-[#0a0a0a] geist-border rounded-xl p-5 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-[#a1a1aa] text-sm font-medium">Pendientes de Confirmar</h3>
                    <i class="fa-solid fa-inbox text-[#a1a1aa]"></i>
                </div>
                <div class="flex items-end gap-2">
                    <span id="metric-pendientes" class="text-3xl font-semibold">0</span>
                    <span class="text-[#a1a1aa] text-sm mb-1">Nuevas</span>
                </div>
            </div>
            <div class="bg-[#0a0a0a] geist-border rounded-xl p-5 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-[#a1a1aa] text-sm font-medium">Citas Hoy</h3>
                    <i class="fa-regular fa-calendar-check text-[#a1a1aa]"></i>
                </div>
                <div class="flex items-end gap-2">
                    <span id="metric-hoy" class="text-3xl font-semibold">0</span>
                    <span class="text-green-500 text-sm mb-1 font-medium">Agenda</span>
                </div>
            </div>
            <div class="bg-[#0a0a0a] geist-border rounded-xl p-5 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-[#a1a1aa] text-sm font-medium">Facturación Estimada</h3>
                    <i class="fa-solid fa-chart-line text-[#a1a1aa]"></i>
                </div>
                <div class="flex items-end gap-2">
                    <span id="metric-facturacion" class="text-3xl font-semibold">0€</span>
                </div>
            </div>
        </div>

        <!-- Requests List -->
        <div class="bg-[#0a0a0a] geist-border rounded-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-[#333] flex justify-between items-center bg-[#050505]">
                <h2 class="font-medium">Solicitudes Recientes</h2>
                <div class="flex gap-2">
                    <span id="action-badge" class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-1 rounded-md text-xs font-medium">Actualizado ahora</span>
                </div>
            </div>
            
            <div id="booking-list" class="divide-y divide-[#333]">
                <!-- Cargando desde DB... -->
                <div class="p-6 text-center text-[#a1a1aa]"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando citas...</div>
            </div>
            
            <div class="px-6 py-4 border-t border-[#333] bg-[#050505] text-center">
                <button class="text-[#a1a1aa] hover:text-white text-sm font-medium transition-colors">Ver historial completo <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></button>
            </div>
        </div>

    </main>
    
    <script src="./db.js"></script>
    <script>
        const PRICING = {
            'Corte Clásico / Fade': 15,
            'Arreglo de Barba': 10,
            'Arreglo de Barba VIP': 12,
            'Corte + Barba': 25,
            'Corte + Barba (Combo VIP)': 25
        };

        function renderBookings() {
            const bookings = getBookings().sort((a, b) => b.timestamp - a.timestamp); // Más recientes primero
            const container = document.getElementById('booking-list');
            
            // Actualizar métricas dinámicas
            let pendientes = 0;
            let citasHoy = 0;
            let facturacion = 0;

            bookings.forEach(b => {
                if (b.status === 'pending') pendientes++;
                if (b.date.toLowerCase().includes('hoy') && b.status !== 'rejected') {
                    citasHoy++;
                    facturacion += (PRICING[b.service] || 15);
                }
            });

            document.getElementById('metric-pendientes').innerText = pendientes;
            document.getElementById('metric-hoy').innerText = citasHoy;
            document.getElementById('metric-facturacion').innerText = facturacion + '€';

            if (bookings.length === 0) {
                container.innerHTML = '<div class="p-6 text-center text-[#a1a1aa]">No hay solicitudes pendientes.</div>';
                return;
            }
            
            let html = '';
            bookings.forEach(b => {
                const isAccepted = b.status === 'accepted';
                const isRejected = b.status === 'rejected';
                
                html += `
                <div class="p-6 hover:bg-[#111] transition-colors ${isAccepted ? 'opacity-50' : ''} ${isRejected ? 'hidden' : ''}">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-full bg-[#1a1a1a] border border-[#333] flex items-center justify-center flex-shrink-0 mt-1">
                                <i class="fa-regular fa-user text-[#a1a1aa]"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-medium text-white">${b.clientName}</h3>
                                    <span class="bg-[#333] text-[#a1a1aa] px-2 py-0.5 rounded text-xs">${b.type || 'Nuevo Cliente'}</span>
                                </div>
                                <p class="text-sm text-[#a1a1aa] mb-1">Quiere reservar: <strong class="text-white font-medium">${b.service}</strong></p>
                                <div class="flex items-center gap-4 text-xs text-[#a1a1aa]">
                                    <span class="flex items-center gap-1"><i class="fa-regular fa-calendar"></i> ${b.date}</span>
                                    <span class="flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${b.time} (${b.duration})</span>
                                    <span class="flex items-center gap-1"><i class="fa-solid fa-phone"></i> ${b.phone}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            ${isAccepted ? 
                                '<span class="text-green-500 text-sm font-medium"><i class="fa-solid fa-check mr-1"></i> Confirmada</span>' : 
                                `<button onclick="handleStatus('${b.id}', 'accepted', '${b.phone}', '${b.clientName}', '${b.date}', '${b.time}')" class="flex-1 md:flex-none bg-white hover:bg-gray-200 text-black px-4 py-2 rounded-md text-sm font-medium transition-colors">Confirmar</button>
                                 <button onclick="handleStatus('${b.id}', 'rejected')" class="flex-1 md:flex-none bg-[#111] hover:bg-red-500/10 hover:text-red-500 hover:border-red-500/50 text-[#a1a1aa] border border-[#333] px-4 py-2 rounded-md text-sm font-medium transition-colors">Rechazar</button>`
                            }
                        </div>
                    </div>
                </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function handleStatus(id, status, phone, name, date, time) {
            updateBookingStatus(id, status);
            renderBookings();

            if (status === 'accepted' && phone) {
                // Formatear mensaje para WhatsApp
                const text = encodeURIComponent(`Hola ${name} 👋\n\nTe confirmo tu cita en *JF Barber* para el *${date}* a las *${time}*.\n\n¡Te esperamos!`);
                const cleanPhone = phone.replace(/[^0-9]/g, '');
                const phoneWithPrefix = cleanPhone.length === 9 ? '34' + cleanPhone : cleanPhone;
                window.open(`https://wa.me/${phoneWithPrefix}?text=${text}`, '_blank');
            }
        }

        // Renderizar al cargar
        renderBookings();
        
        // Escuchar cambios en la base de datos (por si entran nuevas reservas)
        window.addEventListener('storage', () => {
            renderBookings();
            const badge = document.getElementById('action-badge');
            badge.innerText = "¡Nueva cita!";
            badge.classList.replace('bg-blue-500/10', 'bg-green-500/20');
            badge.classList.replace('text-blue-400', 'text-green-400');
            badge.classList.replace('border-blue-500/20', 'border-green-500/40');
            
            setTimeout(() => {
                badge.innerText = "Actualizado";
                badge.classList.replace('bg-green-500/20', 'bg-blue-500/10');
                badge.classList.replace('text-green-400', 'text-blue-400');
                badge.classList.replace('border-green-500/40', 'border-blue-500/20');
            }, 3000);
        });
    </script>
</body>
</html>
